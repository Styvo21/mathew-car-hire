<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Mathew Car Hire</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;

        }

        .subtitle {
            text-align: center;

        button {
            width: 100%;

            cursor: pointer;
        }

            display: none;

            background: #fee2e2;

        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #2563eb;

            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Mathew Car Hire</h1>

    <p class="subtitle">Login to your account</p>

    <form id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <div id="errorMessage" class="message error"></div>


    <div class="register">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </div>

</div>


<script>

const API_URL =
    "https://mathew-car-hire-backend.onrender.com";


document.getElementById("loginForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const email =
        document.getElementById("email")
        .value
        .trim();


    const password =
        document.getElementById("password")
        .value;


    const errorMessage =
        document.getElementById("errorMessage");


    errorMessage.style.display = "none";


    try {

        const response = await fetch(
            `${API_URL}/users/login`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email,
                    password
                })
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Login failed."
            );

        }


        localStorage.setItem(
            "userToken",
            data.token
        );


        localStorage.setItem(
            "user",
            JSON.stringify(data.user)
        );


        window.location.href =
            "user-dashboard.html";


    } catch (error) {

        console.error(error);

        errorMessage.textContent =
            error.message ||
            "Could not connect to the server.";

        errorMessage.style.display = "block";

    }

});

</script>

</body>
</html>
