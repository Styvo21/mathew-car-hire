<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Mathew Car Hire</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #1f2937);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-box {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #111827;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #374151;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #111827;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="register-box">

    <h1>🚗 Mathew Car Hire</h1>

    <p class="subtitle">
        Create your customer account
    </p>

    <form id="registerForm">

        <label>Full Name</label>

        <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            required
        >


        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label>Phone Number</label>

        <input
            type="tel"
            id="phone"
            placeholder="07XXXXXXXX"
        >


        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="At least 6 characters"
            minlength="6"
            required
        >


        <label>Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            minlength="6"
            required
        >


        <button type="submit">
            Create Account
        </button>

    </form>


    <div id="message"></div>


    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>

</div>


<script>

const API_URL =
    "https://mathew-car-hire-backend.onrender.com";


document
    .getElementById("registerForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const fullName =
            document.getElementById("fullName").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const message =
            document.getElementById("message");


        if (password !== confirmPassword) {

            message.style.color = "red";

            message.textContent =
                "Passwords do not match.";

            return;
        }


        message.style.color = "#555";

        message.textContent =
            "Creating your account...";


        try {

            const response =
                await fetch(
                    `${API_URL}/users/register`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            fullName,
                            email,
                            phone,
                            password

                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                message.style.color = "red";

                message.textContent =
                    data.message ||
                    "Registration failed.";

                return;
            }


            localStorage.setItem(
                "userToken",
                data.token
            );


            localStorage.setItem(
                "user",
                JSON.stringify(data.user)
            );


            message.style.color =
                "green";

            message.textContent =
                "Account created successfully!";


            setTimeout(() => {

                window.location.href =
                    "login.html";

            }, 1000);


        } catch (error) {

            console.error(error);

            message.style.color =
                "red";

            message.textContent =
                "Could not connect to the server.";

        }

    });

</script>

</body>
</html>
