<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mathew Car Hire - Admin</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 23px;
}

.logout {
    background: #dc2626;
    color: white;
    border: 0;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
}

.container {
    width: 95%;
    max-width: 1200px;
    margin: 25px auto;
}

.card {
    background: white;
    padding: 25px;
    margin-bottom: 25px;
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

h2 {
    margin-top: 0;
}

.form-group {
    margin-bottom: 15px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button {
    border: 0;
    border-radius: 6px;
    padding: 10px 15px;
    cursor: pointer;
}

.add-btn {
    width: 100%;
    background: #16a34a;
    color: white;
    padding: 13px;
    font-size: 16px;
}

.cars-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
}

.car-card {
    border: 1px solid #ddd;
    border-radius: 10px;
    overflow: hidden;
    background: white;
}

.car-card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
}

.car-info {
    padding: 18px;
}

.car-info h3 {
    margin-top: 0;
}

.available {
    color: #16a34a;
    font-weight: bold;
}

.unavailable {
    color: #dc2626;
    font-weight: bold;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 15px;
}

.edit-btn {
    background: #2563eb;
    color: white;
}

.delete-btn {
    background: #dc2626;
    color: white;
}

.availability-btn {
    background: #f59e0b;
    color: white;
}

.booking {
    border: 1px solid #ddd;
    padding: 18px;
    margin-bottom: 15px;
    border-radius: 8px;
}

.booking p {
    margin: 7px 0;
}

.message {
    display: none;
    padding: 12px;
    margin-bottom: 20px;
    border-radius: 6px;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,.65);
    overflow-y: auto;
}

.modal-content {
    background: white;
    width: 95%;
    max-width: 550px;
    margin: 50px auto;
    padding: 25px;
    border-radius: 10px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.close {
    font-size: 30px;
    cursor: pointer;
}

.save-btn {
    width: 100%;
    background: #2563eb;
    color: white;
    padding: 13px;
}

.cancel-btn {
    width: 100%;
    background: #6b7280;
    color: white;
    padding: 13px;
    margin-top: 8px;
}

.preview {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    margin-top: 10px;
    border-radius: 8px;
    display: none;
}
</style>
</head>

<body>

<header>
    <h1>Mathew Car Hire - Admin Dashboard</h1>
    <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

    <div id="message" class="message"></div>

    <!-- ADD CAR -->

    <div class="card">

        <h2>Add New Car</h2>

        <form id="addCarForm">

            <div class="form-group">
                <label>Car Name</label>
                <input
                    type="text"
                    id="carName"
                    placeholder="Toyota Harrier"
                    required
                >
            </div>

            <div class="form-group">
                <label>Category</label>
                <input
                    type="text"
                    id="carCategory"
                    placeholder="SUV"
                    required
                >
            </div>

            <div class="form-group">
                <label>Price Per Day (KES)</label>
                <input
                    type="number"
                    id="carPrice"
                    placeholder="5000"
                    required
                >
            </div>

            <div class="form-group">
                <label>Availability</label>

                <select id="carAvailable">
                    <option value="true">Available</option>
                    <option value="false">Unavailable</option>
                </select>
            </div>

            <div class="form-group">
                <label>Car Photo</label>

                <input
                    type="file"
                    id="carImage"
                    accept="image/*"
                    required
                >
            </div>

            <button class="add-btn" type="submit">
                Add Car
            </button>

        </form>

    </div>


    <!-- CARS -->

    <div class="card">

        <h2>Cars</h2>

        <div
            id="carsContainer"
            class="cars-grid"
        >
            Loading cars...
        </div>

    </div>


    <!-- BOOKINGS -->

    <div class="card">

        <h2>Bookings</h2>

        <div id="bookingsContainer">
            Loading bookings...
        </div>

    </div>

</div>


<!-- EDIT MODAL -->

<div id="editModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Edit Car</h2>

            <span
                class="close"
                onclick="closeEditModal()"
            >
                &times;
            </span>

        </div>

        <input
            type="hidden"
            id="editCarId"
        >

        <div class="form-group">
            <label>Car Name</label>

            <input
                type="text"
                id="editCarName"
                required
            >
        </div>

        <div class="form-group">
            <label>Category</label>

            <input
                type="text"
                id="editCarCategory"
                required
            >
        </div>

        <div class="form-group">
            <label>Price Per Day</label>

            <input
                type="number"
                id="editCarPrice"
                required
            >
        </div>

        <div class="form-group">
            <label>Availability</label>

            <select id="editCarAvailable">

                <option value="true">
                    Available
                </option>

                <option value="false">
                    Unavailable
                </option>

            </select>
        </div>

        <div class="form-group">

            <label>
                Replace Photo
            </label>

            <input
                type="file"
                id="editCarImage"
                accept="image/*"
                onchange="previewImage()"
            >

            <img
                id="editPreview"
                class="preview"
            >

        </div>

        <button
            class="save-btn"
            onclick="saveEdit()"
        >
            Save Changes
        </button>

        <button
            class="cancel-btn"
            onclick="closeEditModal()"
        >
            Cancel
        </button>

    </div>

</div>


<script>

const API_URL =
"https://mathew-car-hire-backend.onrender.com";


/* LOGIN */

const adminToken =
localStorage.getItem("adminToken");

if (!adminToken) {
    window.location.href =
    "admin-login.html";
}


/* AUTH */

function authHeaders() {

    return {
        "Authorization":
        "Bearer " + adminToken
    };

}


/* MESSAGE */

function showMessage(
    message,
    type = "success"
) {

    const box =
    document.getElementById("message");

    box.textContent = message;

    box.className =
    "message " + type;

    box.style.display = "block";

    setTimeout(() => {

        box.style.display = "none";

    }, 4000);

}


/* LOGOUT */

function logout() {

    localStorage.removeItem(
        "adminToken"
    );

    window.location.href =
    "admin-login.html";

}


/* ESCAPE */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* UPLOAD IMAGE */

async function uploadImage(file) {

    const formData =
    new FormData();

    formData.append(
        "image",
        file
    );

    const response =
    await fetch(
        API_URL + "/upload-image",
        {
            method: "POST",
            headers: authHeaders(),
            body: formData
        }
    );

    const data =
    await response.json();

    if (!response.ok) {

        throw new Error(
            data.message ||
            "Image upload failed"
        );

    }

    return data.imageUrl;

}


/* ADD CAR */

document
.getElementById("addCarForm")
.addEventListener(
"submit",
async function(event) {

    event.preventDefault();

    try {

        const name =
        document.getElementById(
            "carName"
        ).value.trim();

        const category =
        document.getElementById(
            "carCategory"
        ).value.trim();

        const price =
        Number(
            document.getElementById(
                "carPrice"
            ).value
        );

        const available =
        document.getElementById(
            "carAvailable"
        ).value === "true";

        const file =
        document.getElementById(
            "carImage"
        ).files[0];

        if (!file) {

            showMessage(
                "Please select a photo.",
                "error"
            );

            return;

        }

        showMessage(
            "Uploading photo..."
        );

        const imageUrl =
        await uploadImage(file);

        const response =
        await fetch(
            API_URL + "/cars",
            {
                method: "POST",

                headers: {
                    ...authHeaders(),
                    "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                    name: name,

                    category: category,

                    pricePerDay: price,

                    available: available,

                    image: imageUrl

                })
            }
        );

        const data =
        await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to add car"
            );

        }

        showMessage(
            "Car added successfully!"
        );

        document
        .getElementById(
            "addCarForm"
        )
        .reset();

        loadCars();

    }

    catch(error) {

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

    }

});


/* LOAD CARS */

async function loadCars() {

    const container =
    document.getElementById(
        "carsContainer"
    );

    container.innerHTML =
    "Loading cars...";

    try {

        const response =
        await fetch(
            API_URL + "/cars"
        );

        const cars =
        await response.json();

        if (!response.ok) {
            throw new Error(
                "Failed to load cars"
            );
        }

        if (!cars.length) {

            container.innerHTML =
            "<p>No cars available.</p>";

            return;

        }

        container.innerHTML = "";

        cars.forEach(car => {

            const image =
            car.image ||
            "https://via.placeholder.com/600x400?text=No+Image";

            const card =
            document.createElement(
                "div"
            );

            card.className =
            "car-card";

            card.innerHTML = `

                <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(car.name)}"
                    onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'"
                >

                <div class="car-info">

                    <h3>
                        ${escapeHtml(car.name)}
                    </h3>

                    <p>
                        <strong>Category:</strong>
                        ${escapeHtml(car.category)}
                    </p>

                    <p>
                        <strong>Price:</strong>
                        KES
                        ${Number(
                            car.pricePerDay || 0
                        ).toLocaleString()}
                        / day
                    </p>

                    <p>
                        <strong>Status:</strong>

                        ${
                            car.available
                            ?
                            '<span class="available">Available</span>'
                            :
                            '<span class="unavailable">Unavailable</span>'
                        }

                    </p>

                    <div class="actions">

                        <button
                            class="edit-btn"
                            onclick="openEdit(${car.id})"
                        >
                            Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteCar(${car.id})"
                        >
                            Delete
                        </button>

                        <button
                            class="availability-btn"
                            onclick="toggleAvailability(
                                ${car.id},
                                ${car.available}
                            )"
                        >
                            ${
                                car.available
                                ?
                                "Mark Unavailable"
                                :
                                "Mark Available"
                            }
                        </button>

                    </div>

                </div>
            `;

            container.appendChild(card);

        });

    }

    catch(error) {

        console.error(error);

        container.innerHTML =
        "<p style='color:red;'>Failed to load cars.</p>";

    }

}


/* OPEN EDIT */

async function openEdit(id) {

    try {

        const response =
        await fetch(
            API_URL + "/cars/" + id
        );

        const car =
        await response.json();

        if (!response.ok) {

            throw new Error(
                car.message ||
                "Failed to load car"
            );

        }

        document.getElementById(
            "editCarId"
        ).value = car.id;

        document.getElementById(
            "editCarName"
        ).value = car.name || "";

        document.getElementById(
            "editCarCategory"
        ).value =
        car.category || "";

        document.getElementById(
            "editCarPrice"
        ).value =
        car.pricePerDay || "";

        document.getElementById(
            "editCarAvailable"
        ).value =
        car.available
        ? "true"
        : "false";

        document.getElementById(
            "editCarImage"
        ).value = "";

        const preview =
        document.getElementById(
            "editPreview"
        );

        if (car.image) {

            preview.src =
            car.image;

            preview.style.display =
            "block";

        }

        else {

            preview.style.display =
            "none";

        }

        document.getElementById(
            "editModal"
        ).style.display =
        "block";

    }

    catch(error) {

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

    }

}


/* PREVIEW NEW IMAGE */

function previewImage() {

    const file =
    document.getElementById(
        "editCarImage"
    ).files[0];

    if (!file) {
        return;
    }

    const preview =
    document.getElementById(
        "editPreview"
    );

    const reader =
    new FileReader();

    reader.onload =
    function(event) {

        preview.src =
        event.target.result;

        preview.style.display =
        "block";

    };

    reader.readAsDataURL(file);

}


/* SAVE EDIT */

async function saveEdit() {

    const id =
    document.getElementById(
        "editCarId"
    ).value;

    try {

        const name =
        document.getElementById(
            "editCarName"
        ).value.trim();

        const category =
        document.getElementById(
            "editCarCategory"
        ).value.trim();

        const price =
        Number(
            document.getElementById(
                "editCarPrice"
            ).value
        );

        const available =
        document.getElementById(
            "editCarAvailable"
        ).value === "true";

        const file =
        document.getElementById(
            "editCarImage"
        ).files[0];

        let imageUrl = null;

        if (file) {

            showMessage(
                "Uploading new photo..."
            );

            imageUrl =
            await uploadImage(file);

        }

        const updateData = {

            name: name,

            category: category,

            pricePerDay: price,

            available: available

        };

        if (imageUrl) {

            updateData.image =
            imageUrl;

        }

        const response =
        await fetch(
            API_URL + "/cars/" + id,
            {
                method: "PATCH",

                headers: {
                    ...authHeaders(),
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify(
                    updateData
                )
            }
        );

        const data =
        await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to update car"
            );

        }

        showMessage(
            "Car updated successfully!"
        );

        closeEditModal();

        loadCars();

    }

    catch(error) {

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

    }

}


/* CLOSE EDIT */

function closeEditModal() {

    document.getElementById(
        "editModal"
    ).style.display =
    "none";

}


/* DELETE */

async function deleteCar(id) {

    if (
        !confirm(
            "Are you sure you want to delete this car?"
        )
    ) {
        return;
    }

    try {

        const response =
        await fetch(
            API_URL + "/cars/" + id,
            {
                method: "DELETE",
                headers: authHeaders()
            }
        );

        const text =
        await response.text();

        let data = {};

        try {
            data = JSON.parse(text);
        }
        catch {
            data = {
                message: text
            };
        }

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to delete car"
            );

        }

        showMessage(
            "Car deleted successfully!"
        );

        loadCars();

    }

    catch(error) {

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

    }

}


/* AVAILABILITY */

async function toggleAvailability(
    id,
    currentStatus
) {

    try {

        const response =
        await fetch(
            API_URL + "/cars/" + id,
            {
                method: "PATCH",

                headers: {
                    ...authHeaders(),
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify({
                    available:
                    !currentStatus
                })
            }
        );

        const data =
        await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to update availability"
            );

        }

        showMessage(
            "Availability updated!"
        );

        loadCars();

    }

    catch(error) {

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

    }

}


/* LOAD BOOKINGS */

async function loadBookings() {

    const container =
    document.getElementById(
        "bookingsContainer"
    );

    try {

        const response =
        await fetch(
            API_URL + "/bookings",
            {
                headers:
                authHeaders()
            }
        );

        const bookings =
        await response.json();

        if (!response.ok) {

            throw new Error(
                bookings.message ||
                "Failed to load bookings"
            );

        }

        if (!bookings.length) {

            container.innerHTML =
            "<p>No bookings yet.</p>";

            return;

        }

        container.innerHTML = "";

        bookings.forEach(booking => {

            const div =
            document.createElement(
                "div"
            );

            div.className =
            "booking";

            div.innerHTML = `

                <h3>
                    ${escapeHtml(
                        booking.car_name || "Car"
                    )}
                </h3>

                <p>
                    <strong>Customer:</strong>
                    ${escapeHtml(
                        booking.full_name || ""
                    )}
                </p>

                <p>
                    <strong>Phone:</strong>
                    ${escapeHtml(
                        booking.phone || ""
                    )}
                </p>

                <p>
                    <strong>Email:</strong>
                    ${escapeHtml(
                        booking.email || ""
                    )}
                </p>

                <p>
                    <strong>Pick-up:</strong>
                    ${escapeHtml(
                        booking.pickup_date || ""
                    )}
                </p>

                <p>
                    <strong>Return:</strong>
                    ${escapeHtml(
                        booking.return_date || ""
                    )}
                </p>

                <p>
                    <strong>Status:</strong>
                    ${escapeHtml(
                        booking.status || "Pending"
                    )}
                </p>

                <select
                    onchange="updateBookingStatus(
                        ${booking.id},
                        this.value
                    )"
                >

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="Confirmed">
                        Confirmed
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                    <option value="Cancelled">
                        Cancelled
                    </option>

                </select>

            `;

            container.appendChild(div);

        });

    }

    catch(error) {

        console.error(error);

        container.innerHTML =
        "<p style='color:red;'>Failed to load bookings.</p>";

    }

}


/* UPDATE BOOKING */

async function updateBookingStatus(
    id,
    status
) {

    try {

        const response =
        await fetch(
            API_URL +
            "/bookings/" +
            id +
            "/status",
            {
                method: "PATCH",

                headers: {
                    ...authHeaders(),
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify({
                    status: status
                })
            }
        );

        const data =
        await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to update booking"
            );

        }

        showMessage(
            "Booking status updated!"
        );

        loadBookings();

    }

    catch(error) {

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

    }

}


/* CLOSE MODAL OUTSIDE */

window.onclick =
function(event) {

    const modal =
    document.getElementById(
        "editModal"
    );

    if (event.target === modal) {

        closeEditModal();

    }

};


/* START */

loadCars();

loadBookings();

</script>

</body>
</html>
